#:schema https://raw.githubusercontent.com/crate-ci/typos/master/config.schema.json
#

[default]
check-file = true
check-filename = true
extend-ignore-re = [
  # NOTE Allow to mark block of text to exclude from spellchecking inside C++ or Python comments
  '(?Rms)(?:#|//)[ \t]*(?:NOQA|noqa):?[ \t]+spellcheck(?::[ \t]*|=[ \t]*|[ \t]+)off[ \t]*$.*?^[ \t]*(?:#|//)[ \t]*(?:NOQA|noqa):?[ \t]+spellcheck(?::[ \t]*|=[ \t]*|[ \t]+)on[ \t]*$',
  # NOTE Allow to mark a line to exclude from spellchecking
  '(?Rm)^.*(?:#|//)[ \t]*(?:NOQA|noqa):?[ \t]+spellcheck(?::[ \t]*|=[ \t]*|[ \t]+)disable-line[ \t]*$',
  # NOTE Stop checking from this line to the end of file
  # This line is a marker added by Git to the `COMMIT_EDITMSG`.
  '(?Rsm)^# ------------------------ >8 ------------------------$.*',
]
locale = 'en-us'

# NOTE Add repo-wide spelling corrections here.
# To accept a false positive, map the word to itself.
# Check the manual for details.
[default.extend-words]
# codespell:ignore-begin
# TODO Add exceptions/extensions here
# codespell:ignore-end

[default.extend-identifiers]
# codespell:ignore-begin
# TODO Add exceptions/extensions here
# codespell:ignore-end

[files]
ignore-vcs = true

# BEGIN Type-specific settings
[type.rst]
extend-ignore-re = [
  # NOTE Allow to mark block of text to exclude from spellchecking as RST comments
  '(?Rms)^[ \t]*\.\.[ \t]+(?:NOQA|noqa):?[ \t]+spellcheck(?::[ \t]*|=[ \t]*|[ \t]+)off[ \t]*$.*?^[ \t]*\.\.[ \t]+(?:NOQA|noqa):?[ \t]+spellcheck(?::[ \t]*|=[ \t]*|[ \t]+)on[ \t]*$',
]

[type.md]
extend-ignore-re = [
  # NOTE Allow to mark block of text to exclude from spellchecking as HTML comments
  '(?ms)<!--[ \t]*(?:NOQA|noqa):?[ \t]+spellcheck(?::[ \t]*|=[ \t]*|[ \t]+)off[ \t]*-->.*?^[ \t]*<!--[ \t]*(?:NOQA|noqa):?[ \t]+spellcheck(?::[ \t]*|=[ \t]*|[ \t]+)on[ \t]*-->',
]
# END Type-specific settings
